name: chezvoust-pro

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chezvoust}
      MYSQL_USER: ${MYSQL_USER:-chezvoust}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chezvoust_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
      TZ: America/Sao_Paulo
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:4200}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-only-proxy-secret-change-before-public-use}
      APP_TIMEZONE: America/Sao_Paulo
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-chezvoust}
      DB_USERNAME: ${MYSQL_USER:-chezvoust}
      DB_PASSWORD: ${MYSQL_PASSWORD:-chezvoust_local}
      JWT_SECRET: ${JWT_SECRET:-local_only_change_this_64_character_secret_before_any_public_use}
      AUTO_SEED: ${AUTO_SEED:-true}
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./database:/var/www/database:ro
      - api_storage:/var/www/html/storage
    command: ["sh", "-c", "if [ \"$${AUTO_SEED}\" = \"true\" ]; then php bin/seed.php || exit 1; fi; exec apache2-foreground"]
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-only-proxy-secret-change-before-public-use}
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:4200}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-only-proxy-secret-change-before-public-use}
      APP_TIMEZONE: America/Sao_Paulo
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-chezvoust}
      DB_USERNAME: ${MYSQL_USER:-chezvoust}
      DB_PASSWORD: ${MYSQL_PASSWORD:-chezvoust_local}
      JWT_SECRET: ${JWT_SECRET:-local_only_change_this_64_character_secret_before_any_public_use}
      TZ: America/Sao_Paulo
    volumes:
      - ./backend:/var/www/html
      - ./database:/var/www/database:ro
      - api_storage:/var/www/html/storage
    command: ["sh", "-c", "while true; do php bin/worker.php; sleep 30; done"]
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
  api_storage:
