name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Instalar Chromium para os testes
        run: npx playwright install --with-deps --only-shell chromium
      - name: Validar a home e as campanhas no navegador
        run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
  frontend-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Localizar o branch do frontend espelhado
        id: mirror
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          ref=refs/heads/main
          if [[ -n "$PR_BRANCH" ]] && git ls-remote --exit-code --heads https://github.com/AndreRapela/chevous-pro---angular.git "refs/heads/$PR_BRANCH" >/dev/null; then
            ref="refs/heads/$PR_BRANCH"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: AndreRapela/chevous-pro---angular
          ref: ${{ steps.mirror.outputs.ref }}
          path: .frontend-mirror
          persist-credentials: false
      - name: Comparar as duas cópias do frontend
        run: node tests/frontend_mirror.mjs .frontend-mirror
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, gd, mbstring, pdo_mysql
      - run: php tests/backend_core.php
      - run: find backend -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - run: node tests/structure.mjs
      - run: node tests/production_compose.mjs
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Subir aplicação completa
        run: docker compose up -d --build --wait
      - name: Validar saúde e contas de teste
        shell: pwsh
        run: ./tests/compose_smoke.ps1
      - name: Validar checkout e reservas com Stripe simulado
        run: docker compose exec -T api php /dev/stdin /var/www/html < tests/product_checkout.php
      - name: Validar armazenamento e limpeza de mídias de campanha
        run: docker compose exec -T api php /dev/stdin /var/www/html < tests/promotion_storage.php
      - name: Validar descarte seguro da outbox
        shell: pwsh
        run: ./tests/outbox_flow.ps1
      - name: Validar sessões e rotação de tokens
        shell: pwsh
        run: ./tests/security_sessions_flow.ps1
      - name: Validar mensagens em tempo real
        shell: pwsh
        run: ./tests/messaging_flow.ps1
      - name: Validar jornada completa de reserva
        shell: pwsh
        run: ./tests/booking_flow.ps1
      - name: Coletar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color > compose-integration.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-integration-logs
          path: compose-integration.log
      - name: Encerrar containers
        if: always()
        run: docker compose down -v --remove-orphans
