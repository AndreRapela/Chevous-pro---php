<cvp-auth-shell
  variant="recovery"
  eyebrow="Acesso protegido"
  heroTitle="Crie uma nova senha."
  heroDescription="O link é válido por uma hora e só pode ser utilizado uma vez."
  imageSrc="/images/eletricista-login-v1-640.webp"
  imageSrcset="/images/eletricista-login-v1-640.webp 640w, /images/eletricista-login-v1-1280.webp 1280w"
  imageAlt="Eletricista residencial sorrindo com alicate e multímetro"
>
  <a class="back-link" routerLink="/entrar">
    <span aria-hidden="true">←</span>
    Voltar para entrar
  </a>
  @if (success()) {
    <div class="success-mark">✓</div>
    <h2>Senha atualizada</h2>
    <p>Você já pode entrar usando a nova senha.</p>
    <a class="btn btn-primary btn-block" routerLink="/entrar">Entrar</a>
  } @else {
    <h2>Redefinir senha</h2>
    <p class="muted">
      Use ao menos oito caracteres, com letras maiúsculas, minúsculas, número e símbolo.
    </p>
    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Nova senha
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="invalid('password')"
        />
        @if (invalid('password')) {
          <small class="field-error">Informe uma senha forte com ao menos oito caracteres.</small>
        }
      </label>
      <label>
        Confirmar senha
        <input
          type="password"
          formControlName="confirmation"
          autocomplete="new-password"
          [attr.aria-invalid]="invalid('confirmation')"
        />
        @if (invalid('confirmation')) {
          <small class="field-error">As senhas precisam ser iguais.</small>
        }
      </label>
      <button class="btn btn-primary btn-block" type="submit" [disabled]="sending()">
        {{ sending() ? 'Atualizando…' : 'Atualizar senha' }}
      </button>
    </form>
  }
</cvp-auth-shell>
