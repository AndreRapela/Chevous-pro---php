<cvp-auth-shell
  variant="recovery"
  eyebrow="Confirmação de cadastro"
  heroTitle="Confirme seu endereço de e-mail."
  heroDescription="A verificação protege sua conta e confirma que você controla o endereço informado."
  imageSrc="/images/eletricista-login-v1-640.webp"
  imageSrcset="/images/eletricista-login-v1-640.webp 640w, /images/eletricista-login-v1-1280.webp 1280w"
  imageAlt="Eletricista residencial sorrindo com alicate e multímetro"
>
  @if (loading()) {
    <h2>Verificando e-mail…</h2>
    <p class="muted" role="status">Aguarde um instante.</p>
  } @else if (error()) {
    <h2>Não foi possível verificar</h2>
    <div class="alert alert-error" role="alert">{{ error() }}</div>
    <a class="btn btn-secondary btn-block" routerLink="/entrar">Voltar para entrar</a>
  } @else {
    <div class="success-mark">✓</div>
    <h2>E-mail verificado</h2>
    <p>Sua conta está pronta para ser utilizada.</p>
    <a class="btn btn-primary btn-block" routerLink="/entrar">Entrar</a>
  }
</cvp-auth-shell>
