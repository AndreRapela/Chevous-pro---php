<cvp-auth-shell
  variant="register"
  eyebrow="Comece agora"
  [heroTitle]="professionalMode() ? 'Transforme seu talento em oportunidades.' : 'Mais tempo para o que importa.'"
  [heroDescription]="professionalMode() ? 'Monte seu perfil, escolha sua região e organize sua agenda.' : 'Encontre pessoas de confiança para cuidar da sua rotina.'"
  imageSrc="/images/garconete-cadastro-v1-640.webp"
  imageSrcset="/images/garconete-cadastro-v1-640.webp 640w, /images/garconete-cadastro-v1-1086.webp 1086w"
  imageAlt="Garçonete profissional sorrindo com uma bandeja"
  [imageWidth]="1086"
  [imageHeight]="1448"
>
  <a class="back-link" routerLink="/">
    <span aria-hidden="true">←</span>
    Voltar
  </a>
  <h2>Criar conta {{ professionalMode() ? 'profissional' : '' }}</h2>
  <p class="muted">Leva menos de dois minutos.</p>
  @if (error()) {
    <div class="alert alert-error" role="alert">{{ error() }}</div>
  }
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Nome completo
      <input formControlName="name" autocomplete="name" [attr.aria-invalid]="invalid('name')" />
      @if (invalid('name')) {
        <small class="field-error">Informe seu nome completo.</small>
      }
    </label>
    <label>
      E-mail
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        [attr.aria-invalid]="invalid('email')"
      />
      @if (invalid('email')) {
        <small class="field-error">Informe um e-mail válido.</small>
      }
    </label>
    <label>
      Celular
      <input
        type="tel"
        formControlName="phone"
        autocomplete="tel"
        inputmode="tel"
        placeholder="(11) 99999-9999"
        [attr.aria-invalid]="invalid('phone')"
      />
      @if (invalid('phone')) {
        <small class="field-error">Informe um celular válido.</small>
      }
    </label>
    <label>
      Senha
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="invalid('password')"
      />
      <small [class.field-error]="invalid('password')">
        Use 8 caracteres, com maiúscula, minúscula, número e símbolo.
      </small>
    </label>
    <label class="check-row">
      <input type="checkbox" formControlName="terms" />
      <span>
        Li e aceito os
        <a routerLink="/termos">Termos</a>
        e o
        <a routerLink="/privacidade">Aviso de privacidade</a>
        .
      </span>
    </label>
    <button class="btn btn-primary btn-block" type="submit" [disabled]="auth.busy()">
      {{ auth.busy() ? 'Criando conta...' : 'Criar minha conta' }}
    </button>
  </form>
  <p class="auth-switch">
    Já tem conta?
    <a routerLink="/entrar">Entrar</a>
  </p>
  <button class="text-button switch-mode" type="button" (click)="toggleMode()">
    {{ professionalMode() ? 'Quero contratar serviços' : 'Quero prestar serviços' }}
  </button>
</cvp-auth-shell>
