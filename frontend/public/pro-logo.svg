<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 138" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Pro</title>
  <desc id="logo-description">Chez vous pro</desc>
  <defs>
    <g id="aperture-cutouts" fill="#000">
      <path d="M0-15 13-7.5v15L0 15-13 7.5v-15Z"/>
      <g stroke="#000" stroke-width="3.6">
        <path id="slit" d="M13 7.5 12-42"/>
        <use href="#slit" transform="rotate(60)"/><use href="#slit" transform="rotate(120)"/>
        <use href="#slit" transform="rotate(180)"/><use href="#slit" transform="rotate(240)"/>
        <use href="#slit" transform="rotate(300)"/>
      </g>
    </g>
    <mask id="p-shutter" x="-42" y="-42" width="84" height="94" maskUnits="userSpaceOnUse">
      <rect x="-42" y="-42" width="84" height="94" fill="#fff"/>
